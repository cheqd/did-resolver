version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - goconst
    - gocritic
    - misspell
    - nakedret
    - nestif
    - nolintlint
    - unconvert
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          files:
            - $all
          allow:
            - '*'
    dogsled:
      max-blank-identifiers: 3
    goconst:
      min-occurrences: 5
      ignore-string-values:
        - "echo '"
    gocritic:
      disabled-checks:
        - regexpMust
        - badCall
    misspell:
      ignore-rules:
        - cheqd
        - cheq
        - ncheq
    staticcheck:
      # stylecheck (ST*) is merged into staticcheck in v2; keep it disabled until refactor.
      # Quickfix (QF*) checks were not enabled in v1 either.
      checks:
        - all
        - -ST*
        - -QF*
      initialisms:
        - ACL
        - API
        - ASCII
        - CPU
        - CSS
        - DNS
        - EOF
        - GUID
        - HTML
        - HTTP
        - HTTPS
        - ID
        - IP
        - JSON
        - QPS
        - RAM
        - RPC
        - SLA
        - SMTP
        - SQL
        - SSH
        - TCP
        - TLS
        - TTL
        - UDP
        - UI
        - GID
        - UID
        - UUID
        - URI
        - URL
        - UTF8
        - VM
        - XML
        - XMPP
        - XSRF
        - XSS
        - SIP
        - RTP
        - AMQP
        - DB
        - TS
      dot-import-whitelist:
        - github.com/cheqd/cheqd-node/x/did/utils
        - github.com/onsi/gomega
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
